import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'org.springframework.boot' version '4.0.5'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21'
    id 'org.jetbrains.kotlin.kapt' version '2.2.21'
    id 'org.jetbrains.dokka' version '2.2.0'
    // === OpenAPI 문서 생성 플러그인 ===
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'blog'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    mavenCentral()
    google()
    maven { url = uri("https://jitpack.io") }
    maven { url = uri("https://repo.spring.io/milestone") }
    maven { url = uri("https://repo.spring.io/snapshot") }
}

dependencies {
    // === Spring Boot BOM (Gradle 네이티브 플랫폼 방식) ===
    implementation platform("org.springframework.boot:spring-boot-dependencies:4.0.5")

    // === Kotlin ===
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor'
    
    // === 스프링 부트 ===
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // === AOP (SB4-M3에서 spring-boot-starter-aop 미제공 → 직접 의존성) ===
    implementation 'org.springframework:spring-aop'
    implementation 'org.aspectj:aspectjweaver'
    
    // === Jackson Kotlin 지원 ===
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    
    // === Exposed ===
    implementation 'org.jetbrains.exposed:exposed-core:1.2.0'
    implementation 'org.jetbrains.exposed:exposed-dao:1.2.0'
    implementation 'org.jetbrains.exposed:exposed-java-time:1.2.0'
    implementation 'org.jetbrains.exposed:exposed-spring-boot4-starter:1.2.0'
    
    // === MapStruct ===
    implementation 'org.mapstruct:mapstruct:1.6.3'
    
    // === Rate Limiting ===
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.11.0'

    // === JWT ===
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    
    // === 데이터베이스 ===
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.8'

    // === API 문서화 ===
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    // === 로깅 ===
    implementation 'io.github.oshai:kotlin-logging-jvm:6.0.9'
    
    // === 환경변수 관리 ===
    implementation 'me.paulschwarz:springboot4-dotenv:5.1.0'
    
    // === 테스트 ===
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.kotest:kotest-runner-junit5:6.1.10'
    testImplementation 'io.mockk:mockk:1.14.9'
    testRuntimeOnly 'com.h2database:h2'
}

// === Kotlin 컴파일 설정 ===
tasks.withType(KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        freeCompilerArgs.addAll([
            '-Xjsr305=strict',
            '-Xjvm-default=all',
            '-opt-in=kotlin.RequiresOptIn'
        ])
    }
}

// === 테스트 설정 ===
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    forkEvery = 100
    failFast = true
}

// === Kapt 설정 ===
kapt {
    useBuildCache = true
    correctErrorTypes = true
    javacOptions {
        option("-source", "21")
        option("-target", "21")
    }
}

// === 애플리케이션 실행 설정 ===
bootRun {
    jvmArgs = ['-Dfile.encoding=UTF-8', '-Dconsole.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8', '-Dspring.profiles.active=dev']
}

// === JAR 빌드 최적화 (cloudtype 배포용) ===
jar {
    enabled = false
    archiveClassifier = ''
}

bootJar {
    archiveFileName = 'vans-story-be.jar'
    archiveVersion = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    // 빌드 시점에 불필요한 파일 제외 (MANIFEST.MF는 제외하지 않음)
    exclude '**/META-INF/maven/**'
    exclude '**/*.kotlin_metadata'
    exclude '**/*.kotlin_builtins'
}

// cloudtype 배포를 위한 실행 스크립트
task createStartScript(type: CreateStartScripts) {
    outputDir = file('build/scripts')
    mainClass = 'blog.vans_story_be.VansStoryBeApplicationKt'
    applicationName = 'vans-story-be'
    classpath = configurations.runtimeClasspath
    
    // 512MB 환경에 최적화된 JVM 옵션
    defaultJvmOpts = [
        '-Xms128m',
        '-Xmx384m',
        '-XX:+UseG1GC',
        '-XX:+UseStringDeduplication',
        '-XX:MaxGCPauseMillis=200',
        '-XX:+DisableExplicitGC',
        '-Djava.security.egd=file:/dev/./urandom',
        '-Dfile.encoding=UTF-8',
        '-Dconsole.encoding=UTF-8',
        '-Dspring.profiles.active=prod'
    ]
}

// === 빌드 정리 ===
clean {
    delete file("$buildDir/generated")
}

// === Dokka 설정 ===
configurations.matching { it.name.startsWith("dokka") }.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == "com.fasterxml.jackson.core") {
            useVersion("2.15.3")
        }
    }
}

// Spring Boot 메인 클래스 설정
springBoot {
    mainClass = 'blog.vans_story_be.VansStoryBeApplicationKt'
}

// === OpenAPI 문서 생성 설정 ===
openApi {
    apiDocsUrl = "http://localhost:8080/v3/api-docs"
    outputDir = file("$buildDir/docs")
    outputFileName = "api-documentation.json"
    waitTimeInSeconds = 30
}

